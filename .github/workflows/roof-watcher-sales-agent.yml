name: Roof Watcher sales agent — tests

on:
  push:
    branches: [main]
    paths:
      - "28-roof-watcher-sales-agent/**"
      - ".github/workflows/roof-watcher-sales-agent.yml"
  pull_request:
    paths:
      - "28-roof-watcher-sales-agent/**"
      - ".github/workflows/roof-watcher-sales-agent.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 28-roof-watcher-sales-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: pytest
        run: python -m pytest -q
