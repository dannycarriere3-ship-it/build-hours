name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Use stable Copilot model fallback
        run: |
          echo "COPILOT_AGENT_MODEL=sweagent-capi:gpt-5-mini" >> "$GITHUB_ENV"
          echo "COPILOT_AGENT_REASONING_EFFORT=low" >> "$GITHUB_ENV"
